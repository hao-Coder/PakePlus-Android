<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>仓储管理 - 登录</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page login-page">
        <div class="login-container">
            <div class="login-box">
                <div class="login-header">
                    <h1>仓储管理系统</h1>
                    <p>请登录您的账户</p>
                </div>
                <div class="login-form">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" placeholder="请输入用户名">
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" placeholder="请输入密码" >
                    </div>
                    <button class="btn btn-primary btn-block" id="loginBtn">登 录</button>
                </div>
            </div>
        </div>
        <!-- 右下角设置图标 -->
        <div class="settings-icon" id="settingsIcon">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" />
                <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" />
            </svg>
        </div>
        <!-- 设置弹窗（全屏风格） -->
        <div class="modal-overlay fullscreen-modal" id="settingsModal">
            <div class="modal-content fullscreen-content">
                <div class="modal-header fullscreen-header">
                    <button class="btn btn-back" id="settingsBack">&lt; 返回</button>
                    <h3>系统设置</h3>
                    <div style="width:48px;"></div>
                </div>
                <div class="modal-body fullscreen-body">
                    <div class="form-group row-group">
                        <label for="apiAddress">后端服务地址</label>
                        <input type="text" id="apiAddress" placeholder="请输入后端API地址，如 http://10.0.82.228:8000">
                    </div>
                    <small class="form-hint">地址将保存在本地，后续调用后台接口时使用</small>
                </div>
                <div class="modal-footer fullscreen-footer">
                    <button class="btn btn-primary btn-block" id="settingsSaveBtn">保存地址</button>
                </div>
            </div>
        </div>
        <!-- Toast 提示 -->
        <div class="toast" id="toast"></div>
    </div>
    <script src="data/mockData.js"></script>
    <script src="js/app.js"></script>
    <script src="js/request.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
